async function go(){if((cur.sizes||[]).length&&!sz)return alert('पहले साइज़ चुनें');if(q>av(cur))return alert('इतना स्टॉक उपलब्ध नहीं है');GC0=null;
try{if(!auth.currentUser)await login();const d=await db.collection('users').doc(auth.currentUser.uid).get();addrs=d.exists?d.data().addrs||[]:[]}catch(e){return alert('लॉगिन/लोड में दिक्कत: '+e.message)}
sheet('डिलीवरी का पता',addrs.map((a,i)=>`<label class="box"><input type="radio" name="ad" value="${i}" ${i==0?'checked':''} onchange="tg()"><span><b>${esc(a.n)}</b> · ${esc(a.ph)}<br><span class="tag">${esc(fmt(a))}</span></span></label>`).join('')+
`<label class="box"><input type="radio" name="ad" value="new" ${addrs.length?'':'checked'} onchange="tg()"> ➕ नया पता जोड़ें</label><div id="nf" class="col">${addrHTML('a',{n:auth.currentUser.displayName||''})}<label><input type="checkbox" id="sv" checked> यह पता सेव करें</label></div>
<div class="row"><input id="gcc" value="${esc(GCP||'')}" placeholder="🎁 गिफ्ट कार्ड कोड (अगर है तो)"><button class="sm" onclick="gcApply()">लगाएँ</button></div><div id="gcs"></div>
<b id="tot">कुल: ${rs(pr(cur)*q)}</b><button onclick="order()">✅ ऑर्डर कन्फर्म करें (कैश ऑन डिलीवरी)</button>`);tg();if(GCP)gcApply()}
async function gcApply(){const c=$('#gcc').value.trim().toUpperCase();if(!c)return;
try{const d=await db.collection('giftCards').doc(c).get();
if(!d.exists||d.data().status!='active'||d.data().balance<=0){GC0=null;$('#gcs').innerHTML='<span class="tag">❌ यह कोड मान्य नहीं है</span>';totRefresh();return}
GC0={code:c,avail:d.data().balance};$('#gcs').innerHTML=`<span class="tag">✅ गिफ्ट कार्ड लागू: बैलेंस ${rs(GC0.avail)}</span>`;totRefresh()}catch(e){alert('जाँच नहीं हुई: '+e.message)}}
function totRefresh(){const t=pr(cur)*q,use=GC0?Math.min(GC0.avail,t):0;$('#tot').innerHTML=use?`कुल: ${rs(t)} · 🎁 गिफ्ट कार्ड से: ${rs(use)} · <b>COD में देना: ${rs(t-use)}</b>`:`कुल: ${rs(t)}`}
function tg(){const r=document.querySelector('[name=ad]:checked');$('#nf').hidden=!r||r.value!='new'}
async function order(){
const v=document.querySelector('[name=ad]:checked').value;let a;
if(v=='new'){a=readAddr('a');if(!a)return}else a=addrs[+v];
try{const u=auth.currentUser;
if(v=='new'&&$('#sv').checked){addrs=[a,...addrs].slice(0,5);await db.collection('users').doc(u.uid).set({addrs},{merge:true})}
const total=pr(cur)*q,gcUse=GC0?Math.min(GC0.avail,total):0,codAmount=total-gcUse;
const ref=db.collection('orders').doc(),b=db.batch();b.set(ref,{uid:u.uid,name:a.n,phone:a.ph,addr:a,address:fmt(a),items:[{id:cur.id,name:cur.name,price:pr(cur),sp:cur.price,qty:q,size:sz,sellerId:cur.sellerId,sellerName:cur.sellerName||''}],sellerIds:[cur.sellerId],total,codAmount,gcCode:GC0?GC0.code:null,gcUsed:gcUse,sellerAmount:cur.price*q,retAddr:cur.retAddr||'',retOK:!!cur.ret7,status:'नया',sellerState:'pending',log:[LOG('ग्राहक ने ऑर्डर दिया'+(gcUse?' (गिफ्ट कार्ड से ₹'+gcUse+' इस्तेमाल)':''))],createdAt:firebase.firestore.FieldValue.serverTimestamp()});b.update(db.collection('products').doc(cur.id),{sold:firebase.firestore.FieldValue.increment(q),lastOrderId:ref.id});
if(gcUse>0)b.update(db.collection('giftCards').doc(GC0.code),{balance:firebase.firestore.FieldValue.increment(-gcUse),status:(GC0.avail-gcUse<=0)?'used':'active',log:firebase.firestore.FieldValue.arrayUnion(LOG('ऑर्डर में इस्तेमाल: ₹'+gcUse))});
await b.commit();GC0=null;
alert('ऑर्डर हो गया ✅ सेलर के स्वीकार करने के बाद आगे बढ़ेगा');openOrders()}catch(e){alert('ऑर्डर नहीं हुआ (हो सकता है स्टॉक खत्म हो गया या गिफ्ट कार्ड का बैलेंस बदल गया): '+e.message)}}
const stx=o=>o.status=='रद्द'?`<b>❌ ${o.cancelledBy=='seller'?'सेलर ने ऑर्डर रद्द किया':o.cancelledBy=='user'?'आपने ऑर्डर रद्द किया':'ऑर्डर रद्द हुआ'}</b>`:o.sellerState=='pending'?'<b>⏳ सेलर के स्वीकार करने का इंतज़ार</b>':tl(o);
function openOrders(){
if(!auth.currentUser){login().then(()=>openOrders()).catch(()=>{});return}
sheet('मेरे ऑर्डर','<div id="ol" class="col">लोड हो रहा है…</div>');
uo=db.collection('orders').where('uid','==',auth.currentUser.uid).onSnapshot(s=>{
OL=arr(s);bell();$('#ol').innerHTML=OL.map(o=>`<div class="box"><b>${o.items.map(x=>esc(x.name)+(x.size?' ['+esc(x.size)+']':'')+' ×'+x.qty).join(', ')}</b><span class="tag">${ts(o.createdAt)} · ${o.gcUsed?`कुल ${rs(o.total)} · 🎁 ${rs(o.gcUsed)} · COD ${rs(o.codAmount)}`:rs(o.total)}</span>${stx(o)}${o.awb?`<span class="tag">🚚 Delhivery ट्रैकिंग नंबर (AWB): <b>${esc(o.awb)}</b></span><a class="tag" target="_blank" rel="noopener" href="https://www.delhivery.com/">Delhivery साइट पर ट्रैक करें (यह नंबर वहाँ डालें)</a>`:''}${o.sellerState=='pending'&&o.status=='नया'?`<button class="r" onclick="cancel('${o.id}')">ऑर्डर रद्द करें</button>`:''}${o.status=='डिलीवर हुआ'&&o.retOK&&!o.retStatus&&days7(o.deliveredAt)?`<button class="o" onclick="retUI('${o.id}')">↩️ रिटर्न करें</button>`:''}${o.retStatus?retTxt(o):''}${o.status=='डिलीवर हुआ'&&!o.rated?`<button class="o" onclick="rateUI('${o.id}')">⭐ रेटिंग दें</button>`:''}${o.rated?`<span class="tag">⭐ आपने ${o.rating}/5 रेटिंग दी</span>`:''}</div>`).join('')||'अभी कोई ऑर्डर नहीं';localStorage.setItem('sb_seen',Date.now())},e=>$('#ol').textContent='लोड नहीं हुआ: '+e.message)}
function rateUI(id){sheet('रेटिंग दें','<div class="row" id="st5">'+[1,2,3,4,5].map(n=>`<button class="sm o" onclick="setR(${n})" id="s${n}">${n}⭐</button>`).join('')+'</div><textarea id="rc" rows="2" placeholder="कमेंट (वैकल्पिक)"></textarea><button onclick="rateSend(\''+id+'\')">रेटिंग भेजें</button>');window._r=0}
function setR(n){window._r=n;[1,2,3,4,5].forEach(i=>$('#s'+i).style.background=i<=n?'#0f766e':'#fff')}
async function rateSend(id){const n=window._r;if(!n)return alert('स्टार चुनें');const o=OL.find(x=>x.id==id),it=o.items[0];
try{const b=db.batch();b.update(db.collection('orders').doc(id),{rated:true,rating:n,ratingComment:$('#rc').value.trim(),ratedAt:firebase.firestore.FieldValue.serverTimestamp(),log:firebase.firestore.FieldValue.arrayUnion(LOG('ग्राहक ने '+n+' स्टार रेटिंग दी'))});
b.update(db.collection('products').doc(it.id),{ratingSum:firebase.firestore.FieldValue.increment(n),ratingCount:firebase.firestore.FieldValue.increment(1),lastRatedOrderId:id});
await b.commit();shut();alert('रेटिंग के लिए धन्यवाद 🙏')}catch(e){alert('नहीं हुआ: '+e.message)}}
async function cancel(id){if(!confirm('यह ऑर्डर रद्द करें?'))return;const o=OL.find(x=>x.id==id),r=db.collection('orders').doc(id),u={status:'रद्द',cancelledBy:'user',log:firebase.firestore.FieldValue.arrayUnion(LOG('ग्राहक ने ऑर्डर रद्द किया'))};
try{const b=db.batch();b.update(r,u);(o.items||[]).forEach(i=>b.update(db.collection('products').doc(i.id),{sold:firebase.firestore.FieldValue.increment(-i.qty),lastOrderId:id}));await b.commit()}
catch(e){try{await r.update(u)}catch(e2){alert(e2.message)}}}
async function retUI(id){const o=OL.find(x=>x.id==id);let bank={};try{const d=await db.collection('users').doc(auth.currentUser.uid).get();bank=d.exists?d.data().bank||{}:{}}catch(e){}
sheet('रिटर्न रिक्वेस्ट',`<span class="tag">${esc(o.items.map(x=>x.name).join(', '))}</span><textarea id="rr" rows="3" placeholder="रिटर्न का कारण लिखें"></textarea><b>रिफंड के लिए बैंक खाता</b><input id="rac" inputmode="numeric" placeholder="A/c नंबर" value="${esc(bank.acc)}"><input id="rif" placeholder="IFSC कोड" value="${esc(bank.ifsc)}"><button onclick="retSend('${id}')">रिटर्न रिक्वेस्ट भेजें</button>`)}
async function retSend(id){const rr=$('#rr').value.trim(),ac=$('#rac').value.trim(),ifsc=$('#rif').value.trim().toUpperCase();
if(!rr)return alert('रिटर्न का कारण लिखें');
if(!/^\d{9,18}$/.test(ac)||!/^[A-Z]{4}0[A-Z0-9]{6}$/.test(ifsc))return alert('सही A/c नंबर और IFSC कोड भरें');
try{const u=auth.currentUser,b=db.batch();
b.update(db.collection('orders').doc(id),{retStatus:'requested',retReason:rr,retBank:{acc:ac,ifsc},retAt:firebase.firestore.FieldValue.serverTimestamp(),log:firebase.firestore.FieldValue.arrayUnion(LOG('ग्राहक ने रिटर्न रिक्वेस्ट भेजी'))});
b.set(db.collection('users').doc(u.uid),{bank:{acc:ac,ifsc}},{merge:true});
await b.commit();alert('रिटर्न रिक्वेस्ट भेज दी गई ✅');openOrders()}catch(e){alert('नहीं हुआ: '+e.message)}}
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js');
</script></body></html>
